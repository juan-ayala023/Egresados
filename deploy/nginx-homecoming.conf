# =============================================================================
# nginx: bloque de Homecoming 80 Años.
#
# Va AL LADO de los bloques de tcsteatro, tcsrun, tcscamp y fundaciontcs, con
# el mismo patron que ellos: un server_name por evento, en el puerto 80. El
# HTTPS lo pone la capa que esta delante de este servidor (la misma que se lo
# pone a los otros eventos), asi que aqui NO van certificados.
#
# COMO SE INSTALA (ver DESPLIEGUE.md):
#   sudo cp deploy/nginx-homecoming.conf /etc/nginx/sites-available/homecoming
#   sudo ln -s /etc/nginx/sites-available/homecoming /etc/nginx/sites-enabled/
#   sudo nginx -t          <- si esto no dice "ok", NO seguir
#   sudo systemctl reload nginx
#
# reload, no restart: reload no corta ninguna conexion de los otros eventos.
# =============================================================================
server {
    listen 80;
    server_name homecomingtcs.columbus.edu.co;

    # Los PDF de las boletas y los QR pasan por aqui.
    client_max_body_size 5m;

    # --- API: el backend de Node (pm2: homecoming-api, puerto 4000) ----------
    # Todo lo que empieza por /api/ va al backend, incluido el webhook de
    # Wompi (/api/webhooks/wompi) y las imagenes de QR (/api/boletas/.../qr.png).
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Los PDF se generan al vuelo; con muchas compras seguidas puede tardar.
        proxy_read_timeout 60s;
    }

    # --- Sitio: Next.js (pm2: homecoming-web, puerto 3002) --------------------
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Next usa estas dos para el recargado en caliente; en produccion no
        # molestan y evitan un aviso.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
