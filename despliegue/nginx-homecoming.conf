# -----------------------------------------------------------------------------
# NGINX para Homecoming 80 Anios.
#
# Calcado del /home/eventos/nginx.conf que el colegio ya usa para tcsrun,
# tcsteatro, tcscamp y fundaciontcs, CON UNA DIFERENCIA IMPORTANTE:
#
#   Esos cuatro sitios son estaticos. Su front se compila a una carpeta dist
#   que nginx sirve directamente, y su /api/ va al backend de Python.
#
#   Homecoming NO es estatico. El front es Next.js y necesita su propio
#   proceso corriendo (next start, puerto 3000). Y su backend es Node, no
#   Python (puerto 4000).
#
#   Por eso aqui hay DOS proxy_pass y ningun root.
#
# Instalacion (TI):
#   sudo cp nginx-homecoming.conf /etc/nginx/sites-available/homecoming
#   sudo ln -s /etc/nginx/sites-available/homecoming /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado se saca con certbot despues de que el dominio resuelva:
#   sudo certbot --nginx -d tcshomecoming.columbus.edu.co
# -----------------------------------------------------------------------------

server {
    listen 80;
    # BLOQUEANTE: confirmar el nombre con TI. Este sigue el patron de los otros
    # cuatro (tcsrun, tcsteatro, tcscamp).
    server_name tcshomecoming.columbus.edu.co;

    # El QR y el PDF de la boleta viajan por aqui. Los PDF de varias boletas
    # pesan; el limite por defecto de 1 MB se queda corto en la subida de la
    # base de egresados desde /admin.
    client_max_body_size 12M;

    # -------------------------------------------------------------------------
    # API: backend de Node.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El webhook de Wompi y el barrido de reconciliacion pueden tardar:
        # el backend le pregunta a Wompi por transacciones antes de responder.
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Herramientas internas. Van con token, pero ademas no tienen por que
    # aparecer en buscadores ni quedar expuestas mas de lo necesario.
    #
    # Si el colegio quiere restringirlas por IP a la red interna, es aqui:
    #   allow 10.0.0.0/8;  deny all;
    # -------------------------------------------------------------------------
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /puerta {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Sitio publico: front de Next.js.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js usa websocket para el hot reload en desarrollo. En produccion
        # no hace falta, pero no estorba y evita sorpresas si alguien arranca
        # el front en modo dev por error.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
